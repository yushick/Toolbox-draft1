name: Toolbox
options:
  bundleIdPrefix: com.toolbox
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Toolbox:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ToolBox
        excludes:
          - "Tests"
          - "ToolBox-Info.plist"
          - "AppIcon.appiconset"
    settings:
      base:
        PRODUCT_NAME: Toolbox
        PRODUCT_BUNDLE_IDENTIFIER: com.toolbox.Toolbox
        INFOPLIST_FILE: ToolBox/ToolBox-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  ToolboxTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ToolBox/Tests/ToolboxTests
    dependencies:
      - target: Toolbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toolbox.ToolboxTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Toolbox.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Toolbox"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

  ToolboxUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ToolBox/Tests/ToolboxUITests
    dependencies:
      - target: Toolbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toolbox.ToolboxUITests
        TEST_TARGET_NAME: Toolbox
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Toolbox:
    build:
      targets:
        Toolbox: all
        ToolboxTests: [test]
        ToolboxUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: ToolboxTests
        - name: ToolboxUITests
